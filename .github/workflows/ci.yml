name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Production smoke test
        run: pnpm test:smoke

      - name: Build production container
        run: docker build --tag mimix:ci .

      - name: Container smoke test
        run: |
          docker run --detach --name mimix-ci --publish 127.0.0.1:4000:4000 mimix:ci
          trap 'docker logs mimix-ci; docker rm --force mimix-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4000/api/health | grep -F '"status":"ok"'
          curl --fail --silent http://127.0.0.1:4000/ | grep -F 'id="canvas"'
          curl --fail --silent http://127.0.0.1:4000/challenges/mathematics/ | grep -i '<title>'
          curl --fail --silent http://127.0.0.1:4000/challenges/science/ | grep -i '<title>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4000/api/not-found)" = 404

  dependency-audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit workspace dependencies
        continue-on-error: true
        run: pnpm audit --audit-level=high

  secret-audit:
    name: Secret audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz --directory /tmp gitleaks
      - name: Scan Git history for secrets
        continue-on-error: true
        run: /tmp/gitleaks git --redact --no-banner
