<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciencias | Mimix</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Primary Meta Tags -->
  <meta name="title" content="Tarjetas 3D Interactivas">
  <meta name="description" content="Usa gestos de mano para interactuar con tarjetas 3D educativas">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <video id="webcam" autoplay playsinline></video>
  <img id="robot-camera" alt="Video en tiempo real de la Jetson" hidden>
  <canvas id="canvas"></canvas>
  <div id="three-canvas"></div>

  <aside id="atom-lab" aria-live="polite">
    <p class="atom-kicker">LABORATORIO ATÓMICO</p>
    <div id="atom-empty-state">
      <strong>Elige un elemento</strong>
      <span>Acerca índice y pulgar a una tarjeta.</span>
    </div>
    <div id="atom-details" hidden>
      <div class="atom-heading">
        <span id="atom-symbol">O</span>
        <div><strong id="atom-name">Oxígeno</strong><small>Modelo de Bohr interactivo</small></div>
      </div>
      <dl>
        <div><dt>Protones</dt><dd id="atom-protons">8</dd></div>
        <div><dt>Neutrones</dt><dd id="atom-neutrons">8</dd></div>
        <div><dt>Electrones</dt><dd id="atom-electrons">8</dd></div>
        <div><dt>Carga</dt><dd id="atom-charge">0</dd></div>
      </dl>
      <p class="atom-shells">Capas: <span id="atom-shells">2 · 6</span></p>
      <div class="atom-controls" aria-label="Cambiar carga del ion">
        <button id="atom-charge-down" type="button" aria-label="Agregar un electrón">+ e⁻</button>
        <button id="atom-charge-up" type="button" aria-label="Quitar un electrón">− e⁻</button>
      </div>
      <p class="atom-help">Pinch en el átomo y mueve tu mano para rotarlo. Pinch en + o − para formar un ion.</p>
    </div>
  </aside>

  <!-- Título principal -->
  <div id="main-title">
    <h1>¿Cómo podemos...?</h1>
  </div>

  <!-- Robot flotante - SIN cuadro contenedor, solo el robot 3D -->
  <div id="robot-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="socketBridge.js"></script>
  <script type="module" src="main.js"></script>

  <!-- GLTFLoader usa la instancia de Three.js ya cargada arriba. -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <!-- Nuevos módulos del robot -->
  <script type="module" src="../../robot/robotManager.js"></script>
  <script type="module" src="../../robot/robotShapeIntegration.js"></script>
  <script type="module" src="../../robot/robotUtils.js"></script>
</body>
</html>
