<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ciencias | Mimix</title>
  <link rel="stylesheet" href="styles.css">

  <!-- Primary Meta Tags -->
  <meta name="title" content="Tarjetas 3D Interactivas">
  <meta name="description" content="Usa gestos de mano para interactuar con tarjetas 3D educativas">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <video id="webcam" autoplay playsinline></video>
  <img id="robot-camera" alt="Video en tiempo real de la Jetson" hidden>
  <canvas id="canvas"></canvas>
  <div id="three-canvas"></div>

  <section id="periodic-explorer" aria-label="Tabla periódica interactiva">
    <div id="periodic-table"></div>
  </section>

  <main id="atom-focus" aria-live="polite" hidden>
    <section class="atom-info">
      <button id="atom-back" type="button">← Volver a la tabla</button>
      <p class="atom-kicker">MODELO ATÓMICO</p>
      <div id="atom-details">
        <div class="atom-heading">
          <div class="atom-number"><span id="atom-mass-number">24</span><span id="atom-atomic-number">12</span></div>
          <span id="atom-symbol">Mg</span>
          <div><strong id="atom-name">Magnesio</strong><small>Modelo de Bohr interactivo</small></div>
        </div>
        <dl>
          <div><dt>Protones</dt><dd id="atom-protons">12</dd></div>
          <div><dt>Neutrones</dt><dd id="atom-neutrons">12</dd></div>
          <div><dt>Electrones</dt><dd id="atom-electrons">12</dd></div>
          <div><dt>Carga</dt><dd id="atom-charge">0</dd></div>
        </dl>
        <p class="atom-shells">Capas: <span id="atom-shells">2 · 8 · 2</span></p>
        <div class="atom-controls" aria-label="Cambiar carga del ion">
          <button id="atom-charge-down" type="button" aria-label="Agregar un electrón">+ e⁻</button>
          <button id="atom-charge-up" type="button" aria-label="Quitar un electrón">− e⁻</button>
        </div>
        <p class="atom-help">Mantén un pinch y mueve tu mano sobre el átomo para rotarlo. Haz pinch en + o − para formar un ion.</p>
      </div>
    </section>
    <section class="atom-visual" aria-label="Vista tridimensional del átomo">
      <div id="atom-render-region" aria-hidden="true"></div>
      <p>Gira el átomo con tu mano</p>
    </section>
  </main>

  <!-- Título principal -->
  <div id="main-title">
    <h1>Explora los elementos</h1>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="socketBridge.js"></script>
  <script type="module" src="main.js"></script>

</body>
</html>
